name: Actionlint

# Static checker for the workflow YAML files themselves - catches invalid
# expressions (typo'd secrets./steps. references), wrong permissions:
# scopes, and (via its built-in shellcheck/pyflakes integration) issues in
# the bash inside run: blocks.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          fail_level: error
