name: deploy-dev

# Dev/staging for the paused account-management/billing work — see
# scenestealer-infra's neon.tf (`scenestealer_dev`) and
# apps/api/wrangler.toml's `[env.dev]` block. Deliberately its own
# workflow file, not a branch condition inside deploy.yml: keeps
# production's deploy path completely untouched by anything here,
# rather than relying on an if: check inside a shared job to keep the
# two apart. No deploy-postiz-proxy or deploy-worker job — dev never
# touches the video-clipping pipeline (R2/Queue/Fly), only web+api+DB.

on:
  push:
    branches: [dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "9.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.12.0"
          cache: "pnpm"
      - name: Force HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  deploy-web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "9.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.12.0"
          cache: "pnpm"
      - name: Force HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scenestealer/db build
      - run: pnpm --filter @scenestealer/web run pages:build
      # --branch=dev (not main) publishes to this same Pages project's
      # separate `preview` deployment target — its own URL
      # (dev.scenestealer-web.pages.dev) and its own isolated env vars,
      # never the `production` config that's actually serving live
      # traffic. See apps/web/.env.production's own comment for why
      # NEXT_PUBLIC_API_URL still needs to resolve correctly at build
      # time regardless of environment.
      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages deploy .vercel/output/static --project-name=scenestealer-web --branch=dev

  deploy-api:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "9.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.12.0"
          cache: "pnpm"
      - name: Force HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scenestealer/db build
      # --env dev deploys wrangler.toml's [env.dev] block — a genuinely
      # separate Worker (scenestealer-api-dev), same account/token,
      # structurally unable to touch the production Worker's config.
      - name: Deploy to Cloudflare Workers (dev env)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy --env dev
