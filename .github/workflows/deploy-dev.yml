name: deploy-dev

# Dev/staging for the paused account-management/billing work — see
# scenestealer-infra's neon.tf (`scenestealer_dev`) and
# apps/api/wrangler.toml's `[env.dev]` block. Deliberately its own
# workflow file, not a branch condition inside deploy.yml: keeps
# production's deploy path completely untouched by anything here,
# rather than relying on an if: check inside a shared job to keep the
# two apart. No deploy-postiz-proxy or deploy-worker job — dev never
# touches the video-clipping pipeline (R2/Queue/Fly), only web+api+DB.

on:
  push:
    branches: [dev]

# One deploy at a time, in order. Without this, merging several PRs in a
# row started overlapping deploys that could finish out of order, so an
# older commit's deploy could land last and overwrite a newer one (seen
# 2026-10-19: four merges, four simultaneous deploys). A running deploy
# is never cancelled midway; GitHub keeps at most one waiting run per
# group, so if several merges queue up behind it, only the newest
# waiting one runs — which is exactly the commit that should end up live.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "9.15.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.12.0"
          cache: "pnpm"
      - name: Force HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  deploy-web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "9.15.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.12.0"
          cache: "pnpm"
      - name: Force HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scenestealer/db build
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, so
      # unlike the API deploy below (where --env dev alone is enough),
      # the dev web build needs its own build-time override to actually
      # talk to the dev API Worker instead of production — apps/web's
      # own wrangler.toml [env.dev] only controls runtime bindings, not
      # this. Same NEXT_PUBLIC_API_URL override used for the one-off
      # manual dev deploy during the OpenNext migration (2026-09-17).
      - run: pnpm --filter @scenestealer/web run cf:build
        env:
          NEXT_PUBLIC_API_URL: https://scenestealer-api-dev.scenestealer.workers.dev
      # --env dev deploys wrangler.toml's [env.dev] block — a genuinely
      # separate Worker (scenestealer-web-dev), same account/token,
      # reached at its own workers.dev subdomain, never the production
      # config that's actually serving live traffic.
      - name: Deploy to Cloudflare Workers (dev env)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy --env dev

  deploy-api:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "9.15.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.12.0"
          cache: "pnpm"
      - name: Force HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scenestealer/db build
      # --env dev deploys wrangler.toml's [env.dev] block — a genuinely
      # separate Worker (scenestealer-api-dev), same account/token,
      # structurally unable to touch the production Worker's config.
      - name: Deploy to Cloudflare Workers (dev env)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy --env dev
