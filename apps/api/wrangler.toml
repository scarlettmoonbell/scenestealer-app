name = "scenestealer-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Pinned explicitly (2026-09-16) — this Cloudflare login has access to two
# accounts (the personal one and this dedicated "SceneStealer" one, per
# the Phase A account-migration plan). Without this, `wrangler deploy`
# silently defaults to the wrong one when none is specified: a real
# incident, not hypothetical — an hour was lost deploying successfully to
# the WRONG account while api.scenestealer.app kept serving stale code,
# because nothing here forced the right target.
account_id = "98ccbdecb3c59d57acf9d24956abf2fc"

# Provisioned by scenestealer-infra — see that repo's opentofu/README.md.
# Consumer runs analyze jobs outside this Worker's own HTTP request/
# response cycle — POST /videos/:id/analyze just enqueues and returns.
# Needed because apps/api sits behind a Cloudflare Custom Domain, whose
# edge proxy times out an HTTP response at ~100s regardless of the
# Workers runtime's own much more generous execution limits; a large
# video's analysis routinely takes longer than that. A Queue consumer
# invocation isn't behind that same edge-proxy path at all, and gets a
# 15-minute wall-time ceiling instead — real error hit in production
# 2026-09-05 (a 1.24GB upload), not a hypothetical. max_batch_size = 1
# keeps that 15-minute budget scoped to one job, not shared across a
# batch.
[[queues.producers]]
queue = "scenestealer-jobs"
binding = "JOBS_QUEUE"

[[queues.consumers]]
queue = "scenestealer-jobs"
max_batch_size = 1

# Top-level (shared between prod and any future dev use, unlike queues/R2
# which [env.dev] deliberately omits) — holds no tenant data at all, just
# one short-lived WebAuthn challenge for the admin passkey flow. See
# admin-challenge-store.ts.
[[durable_objects.bindings]]
name = "ADMIN_CHALLENGE_STORE"
class_name = "AdminChallengeStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdminChallengeStore"]

# 100% sampling deliberately, not the platform default — real traffic is
# still low enough (alpha phase, one tenant testing) that full log
# retention costs nothing meaningful, and it's the only way this gap
# (identified via claude-docs-conventions' Logging & observability
# section, 2026-09-07: "every Worker should ship with
# observability.enabled: true") actually pays off in a debugging session
# instead of after the fact. Revisit the sampling rate once real usage
# volume makes 100% retention costly.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Non-secret config only. Secrets (DATABASE_URL, CLERK_SECRET_KEY,
# CLERK_WEBHOOK_SIGNING_SECRET, STRIPE_SECRET_KEY, POSTIZ_API_KEY,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, WORKER_SHARED_SECRET,
# MEDIA_URL_SECRET) are set via `wrangler secret put`, never committed
# here. CLERK_PUBLISHABLE_KEY, R2_ACCOUNT_ID, and R2_BUCKET_NAME aren't
# sensitive, but are set the same way for now rather than split across
# two mechanisms.
#
# ADMIN_SETUP_TOKEN (`wrangler secret put`) gates the one-time admin
# passkey bootstrap (routes/admin-auth.ts's POST /setup/*) — rotate or
# delete it right after real first use so that route can't register a
# second, unauthorized identity later. Nothing else reads this secret.
#
# RESEND_API_KEY (also set via `wrangler secret put`, when ready) is
# optional — routes/internal.ts's completion-email step skips quietly
# without it. Needs a verified sending domain on Resend's side first;
# not yet provisioned as of 2026-09-07, see ROADMAP.md.
#
# FLY_API_TOKEN (`wrangler secret put`, manual — a narrowly-scoped Fly
# deploy token for the scenestealer-worker app specifically, distinct
# from the CI-only FLY_API_TOKEN GitHub Actions secret) and
# WORKER_IMAGE_REF (set automatically by .github/workflows/deploy.yml's
# deploy-worker job after each deploy) are how apps/api spawns a
# per-job Fly Machine via fly-machines.ts — see that file and
# apps/worker/fly.toml for the full picture. WORKER_URL is gone: as of
# 2026-09-07 apps/api never calls the worker over HTTP itself, only the
# other direction (routes/internal.ts's completion-notify callback,
# still authenticated with WORKER_SHARED_SECRET).
WEB_ORIGIN = "https://scenestealer.app"
# This Worker's own public origin — see index.ts's Env.API_ORIGIN.
API_ORIGIN = "https://api.scenestealer.app"

# Dev/staging environment for the paused account-management/billing work
# (see scenestealer-infra's neon.tf `scenestealer_dev` resources) — a
# genuinely separate Worker (`scenestealer-api-dev`), not a copy of
# production. Deliberately has no [[queues.producers/consumers]] block:
# billing work never touches the analyze/render pipeline, so this
# environment has no queue binding at all rather than a placeholder one.
# No custom domain either — reached at its own workers.dev subdomain.
# Its own secrets: `wrangler secret put --env dev <NAME>`.
[env.dev]
name = "scenestealer-api-dev"

[env.dev.vars]
# Pages' own branch-alias URL for a non-production `--branch=dev`
# deploy — confirmed via the Pages API's own `aliases` field on a real
# preview deployment (not the plain `<project>.pages.dev` guessed at
# first; this project's actual pages.dev domain carries a random
# suffix, `-31p`, same as the CNAME target apex/www already point at).
WEB_ORIGIN = "https://dev.scenestealer-web-31p.pages.dev"
# This env's own workers.dev subdomain (account subdomain confirmed as
# "scenestealer" this session).
API_ORIGIN = "https://scenestealer-api-dev.scenestealer.workers.dev"

[env.dev.observability]
enabled = true
head_sampling_rate = 1

