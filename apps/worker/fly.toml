# Deploy config for apps/worker — as of 2026-09-07, this app has no
# always-on process at all. apps/api dispatches each analyze/render job
# by spawning a fresh, disposable Machine per job via Fly's Machines API
# (see routes/videos.ts and clips.ts), each running index.ts's one-shot
# CLI mode with JOB_TYPE/SOURCE_VIDEO_ID or CLIP_ID as env vars and
# `auto_destroy: true` — the Machine cleans itself up the instant the
# process exits, billed per-second only while it actually runs. This is
# PLAN.md's originally-envisioned target architecture (Cloudflare Queue
# -> Fly Machines API -> a fresh Machine spawned per job), finally built;
# index.ts's one-shot CLI entry point existed for exactly this since
# Phase 4 and was unused until now.
#
# This *replaces* the previous always-on `[http_service]` approach
# (server.ts, removed) rather than sitting alongside it. That approach
# went through two real failure modes before landing here (see
# ROADMAP.md, 2026-09-05 through 09-07): first, Fly's own idle-connection
# `auto_stop_machines` killing a still-in-progress job because it had no
# visibility into whether a subprocess was genuinely still working;
# fixed by going always-on instead (min_machines_running = 1). Second,
# once always-on, `shared-cpu-2x` throttled hard under the sustained CPU
# load a real transcode/scene-detection job needs — confirmed by reading
# `/proc/<pid>/stat` for the actual `ffmpeg` process on the live machine:
# 36.5 minutes of wall-clock elapsed against only ~532 CPU-seconds
# consumed, ~24% of one core. Bumping the *always-on* machine to a
# `performance` (non-throttled) size would have fixed the throttling but
# reintroduced the original cost problem this whole investigation was
# about: paying 24/7 for dedicated CPU that's idle between uploads,
# directly working against controlling per-job compute cost as usage
# grows past one alpha tester. Per-job Machines with `performance` CPU
# sizing (set per-request in the Machines API call, not here) solve both
# at once — no throttling, no idle cost.
#
# Lives here (not scenestealer-infra), matching postiz/fly.toml and
# temporal/fly.toml's convention — Fly.io apps deploy via `flyctl` from
# this repo's own tooling, not Terraform.

app = "scenestealer-worker"
primary_region = "iad"

[build]

# Secrets (DATABASE_URL, GROQ_API_KEY, ANTHROPIC_API_KEY, R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, WORKER_SHARED_SECRET)
# are set via `flyctl secrets set`, never committed here.
[env]
  # Lets a per-job Machine call back into apps/api once it finishes,
  # purely to trigger emailing the tenant who kicked an analyze run off
  # — see analyze.ts's notifyApiOfCompletion and routes/videos.ts's POST
  # /internal/analysis-complete. Authenticated with the same
  # WORKER_SHARED_SECRET already used for the reverse direction.
  API_URL = "https://api.scenestealer.app"

# No [http_service] — nothing serves HTTP traffic in this app anymore;
# every real job runs as a one-shot Machine spawned directly via the
# Machines API, sized per-request (performance-2x/4gb as of this
# writing — see routes/videos.ts and clips.ts), not from a fly.toml
# default. This [[vm]] exists only as a fallback in case `flyctl deploy`
# still expects some default Machine spec to push a release against with
# no [http_service] present — deliberately small/cheap, since it's not
# what real jobs actually run on.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Confirmed for real (2026-09-07): without this, `flyctl deploy`'s
# release machine (above) crash-loops — it runs the image's default CMD
# (`node dist/index.js` with no JOB_TYPE set, since this app has no
# real default process — see Dockerfile's own comment), which exits 1
# immediately, and Fly's default restart policy just reboots it forever
# (observed live: exit -> reboot -> exit again, every ~11s). `policy =
# "never"` still lets `flyctl deploy` start it once (it exits 1 right
# away, harmless and cheap) but stops the endless reboot loop.
[[restart]]
  policy = "never"
