# Deploy config for apps/worker's always-on HTTP mode (src/server.ts) —
# a deliberately smaller first cut than PLAN.md's eventual architecture
# (Cloudflare Queue -> consumer Worker -> Fly Machines API -> a fresh
# Machine spawned per job). apps/api's POST /videos/:id/analyze now
# dispatches via the scenestealer-jobs Cloudflare Queue (2026-09-05,
# fixing a real edge-proxy timeout — see ROADMAP.md), but that queue's
# consumer still calls this one always-on-when-warm Fly app's /analyze
# route rather than spawning a fresh Machine per job via the Machines
# API — that half of PLAN.md's eventual architecture isn't built yet.
#
# Lives here (not scenestealer-infra), matching postiz/fly.toml and
# temporal/fly.toml's convention — Fly.io apps deploy via `flyctl` from
# this repo's own tooling, not Terraform.
#
# Scaled to zero when idle (min_machines_running = 0, auto_stop/start),
# unlike Postiz's always-on config — this workload is sporadic (one
# analysis per uploaded video), not steady-state traffic.

app = "scenestealer-worker"
primary_region = "iad"

[build]

# Secrets (DATABASE_URL, GROQ_API_KEY, ANTHROPIC_API_KEY, R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, WORKER_SHARED_SECRET)
# are set via `flyctl secrets set`, never committed here.
[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  # 1gb -> 2gb (2026-09-05) wasn't enough either: `fly logs` confirmed
  # two MORE OOM kills afterward on the same 1.24GB upload, anon-rss
  # reaching ~1.87GB and ~1.9GB before each kill — right up against
  # the 2048MB ceiling, not comfortably under it. Fly's own proxy
  # reports "connection closed before message completed" when the
  # machine dies mid-request, which apps/api's fetch sees as a plain-
  # text "error code: 502" response — the real source of what looked
  # like a live Cloudflare timeout in the UI (see ROADMAP.md). Bumped
  # to 4gb for real headroom above the ~1.9GB actually observed. Not a
  # scale-to-zero cost concern — only affects the size of the machine
  # while it's actually running a job, not whether it runs
  # continuously.
  memory = "4gb"
