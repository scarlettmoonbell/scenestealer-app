title = "SceneStealer gitleaks config"

[extend]
useDefault = true

# False positive, not a real secret: the `generic-api-key` rule's entropy
# heuristic flags `renderedR2Key: clips.renderedR2Key` (a Drizzle
# .select() column alias in apps/api/src/routes/videos.ts) — the mixed-
# case "R2" plus identifier length crosses its entropy threshold. The
# same identifier appears elsewhere in this codebase (schema.ts,
# clips.ts, clip-editor.tsx, render.ts) without tripping this; only this
# specific object-literal shape does. Allowlisted by exact match text
# rather than by commit fingerprint so it stays suppressed across future
# commits/rebases, not just the one that first hit it.
[allowlist]
regexes = [
  '''clips\.renderedR2Key''',
  # Also not a real secret: Clerk's *publishable* key (apps/web/.env.production)
  # — the `pk_` prefix distinguishes it from a secret key (`sk_`) exactly the
  # same way Stripe's publishable/secret split works. It's meant to ship in
  # the client bundle; the `generic-api-key` rule's entropy heuristic can't
  # tell public keys from secret ones, only high vs. low entropy.
  '''pk_(test|live)_[A-Za-z0-9]+''',
]
